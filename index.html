<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css">

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
        .attribution {
            font-size: 11px;
            text-align: center;
        }

        .attribution a {
            color: hsl(228, 45%, 44%);
        }
    </style>
</head>
<body>
<main class="w-screen h-screen flex flex-col justify-center items-center">
    <div class="card-box bg-white w-fit max-w-xs mx-auto rounded-3xl !p-8 flex flex-col items-center justify-center gap-8">
        <div class="overflow-hidden rounded-xl">
            <img src="./images/image-qr-code.png" alt="QR Code" class="w-full">
        </div>
        <div class="text-center flex flex-col items-center gap-4">
            <h3 class="text-xl">
                Improve your front-end skills by building projects
            </h3>
            <p>
                Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
            </p>
        </div>

    </div>

  <div class="attribution !my-8">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://www.linkedin.com/in/dbillybrown/">Kano Dekou Billy Brown</a>.
  </div>
</main>
</body>
</html>
